name: CI

on:
  push:
    branches: [main, "scaffold/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Provide a dummy DATABASE_URL so Prisma client generation doesn't fail
          DATABASE_URL: "postgresql://user:password@localhost:5432/learninghub"

      - name: Test
        run: npm test
